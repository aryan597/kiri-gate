[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kiri-gate"
version = "0.1.0"
description = "A gate in front of your AI agent's tools: acts on what can be undone, asks about what can't."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
include = ["kiri_gate*"]
