[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kiri-gate"
version = "0.2.1"
description = "A gate in front of your AI agent's tools: acts on what can be undone, asks about what can't."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
kiri-gate = "kiri_gate.cli:main"

[tool.setuptools.packages.find]
include = ["kiri_gate*"]

[tool.setuptools.package-data]
kiri_gate = ["static/*"]
